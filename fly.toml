# fly.toml app configuration file for moonbuggy-relay
# WebSocket relay server for MoonBuggy multiplayer

app = 'moonbuggy-relay'
primary_region = 'sjc'

[build]

# Use services instead of http_service for better WebSocket handling
[[services]]
  internal_port = 9080
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.ports]]
    handlers = ["http"]
    port = 80

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
